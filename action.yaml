name: test-report-observability-action
description: Send test reports to Datadog

inputs:
  junit-xml-path:
    description: Glob pattern to the JUnit XML file(s)
    required: true
  metric-name-prefix:
    description: Prefix of the name of metrics
    required: true
    default: testreport
  filter-test-file-slower-than:
    description: Filter test files slower than the threshold (in seconds)
    required: true
    default: '1'
  filter-test-case-slower-than:
    description: Filter test cases slower than the threshold (in seconds)
    required: true
    default: '1'
  failed-test-report-artifact-name-prefix:
    description: The artifact name of the failed test report for detecting the flaky tests
    required: true
    default: failed-test-report-${{ github.job }}-${{ strategy.job-index }}-
  test-case-base-directory:
    description: Base directory to resolve the test case file path
    required: false
  test-case-file-fallback:
    description: Fallback for resolving a JUnit testcase file when the file attribute is missing
    required: false
    default: none
  playwright-json-path:
    description: Glob pattern to the Playwright JSON report for completeness and retry validation
    required: false
  require-complete-playwright-report:
    description: If true, suppress metrics unless the Playwright JSON report is complete
    required: true
    default: 'false'
  playwright-retry-summary-path:
    description: Path to write a sanitized Playwright retry summary JSON
    required: false
  enable-metrics:
    description: If false, do not send the metrics to Datadog
    required: true
    default: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  send-test-case-success:
    description: Send succeeded test cases
    required: true
    default: 'false'
  send-test-case-failure:
    description: Send failed test cases
    required: true
    default: 'true'
  datadog-api-key:
    description: Datadog API key
    required: false
  datadog-site:
    description: Datadog site
    required: false
  sentry-dsn:
    description: Sentry DSN for sending the test cases
    required: false
  tags:
    description: Tags for Datadog and Sentry (key:value of multiline string)
    required: false

outputs:
  playwright-report-state:
    description: The Playwright report state when playwright-json-path is configured

runs:
  using: 'node24'
  main: 'dist/index.js'
