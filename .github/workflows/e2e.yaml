name: e2e

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/e2e.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/e2e.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g pnpm@latest-10
      - run: pnpm i
      - run: pnpm run build

      # The test fixture intentionally fails on the first attempt.
      - run: pnpm run test
        env:
          ENABLE_FLAKY_TEST_FIXTURE: true

      - if: always()
        name: quipper/test-report-observability-action
        uses: ./
        with:
          junit-xml-path: junit.xml
          send-test-case-success: true
          filter-test-file-slower-than: 0
          filter-test-case-slower-than: 0
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          tags: |
            service:test-report-observability-action
