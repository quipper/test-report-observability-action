name: wait-for-workflows

on:
  pull_request:

jobs:
  wait-for-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write # To rerun workflows.
      checks: read
    steps:
      # Wait for the e2e workflow and rerun it.
      - uses: int128/wait-for-workflows-action@2875ef6993779fbdcabf6c04d6c66e1278042b0e # v1.92.0
        continue-on-error: true
        with:
          filter-workflow-names: e2e
      - uses: int128/rerun-workflows-action@31acb5ea947ea683732e58f8b7e816384e218551 # v1.12.0

      # Finally, wait for all workflows.
      - uses: int128/wait-for-workflows-action@2875ef6993779fbdcabf6c04d6c66e1278042b0e # v1.92.0
