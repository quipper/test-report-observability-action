name: wait-for-workflows

on:
  pull_request:

jobs:
  wait-for-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write # To rerun workflows.
      checks: read
    steps:
      # Wait for the e2e workflow and rerun it.
      - uses: int128/wait-for-workflows-action@c964794ae4e6923dbd7043d6745821254831510b # v1.94.0
        continue-on-error: true
        with:
          filter-workflow-names: e2e
      - uses: int128/rerun-workflows-action@4a08d518c08dbdd0960bf780b91ea143a22420c7 # v1.14.0

      # Finally, wait for all workflows.
      - uses: int128/wait-for-workflows-action@c964794ae4e6923dbd7043d6745821254831510b # v1.94.0
